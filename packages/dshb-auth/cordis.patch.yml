- insert:
    - id: dshb-auth
      name: dshb-auth
- id: web-startup
  name: '@deepseek-ai/dsh-web-app/startup'
  disabled: true
- insert:
    - id: dshb-web-startup
      name: dshb-auth/startup
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  disabled: true
- insert:
    - id: dshb-webserver
      name: dshb-auth/webserver
      inject:
        - webStartup
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080
