- insert:
    - id: dshb-auth
      name: dshb-auth
- insert:
    - id: dshb-web-startup
      name: dshb-auth/startup
- insert:
    - id: dshb-webserver
      name: dshb-auth/webserver
      inject:
        - webStartup
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080
